name: Security

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST (medium/high gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build:storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Serve Storybook
        run: |
          npx http-server _site -p 6006 --silent &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6006 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Storybook did not start within 30 seconds" >&2
          exit 1

      - name: Scan Storybook with OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:6006
          cmd_options: -I -j
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-security-report

      - name: Enforce medium/high new-finding gate
        if: always()
        run: node scripts/check-zap-results.mjs report_json.json .zap/baseline.json
